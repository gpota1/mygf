<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Important Question 💘</title>

<style>
body {
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg,#ff4d6d,#ff8fab,#ffc2d1);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
  text-align:center;
  color:white;
}

.container {
  background: rgba(0,0,0,0.6);
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:500px;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
}

img {
  width:100%;
  border-radius:15px;
  margin-bottom:20px;
}

h1 {
  font-size:28px;
  margin-bottom:10px;
}

p {
  margin-bottom:20px;
  font-size:16px;
}

button {
  padding:12px 20px;
  font-size:16px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  margin:5px;
  transition:0.2s ease;
}

#yesBtn {
  background:#ff4d6d;
  color:white;
}

#yesBtn:hover {
  transform:scale(1.1);
}

#noBtn {
  background:white;
  color:black;
  position:relative;
}

#message {
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
  <img src="us.jpg" alt="Us being cute">
  <h1>🚨 VERY IMPORTANT QUESTION 🚨</h1>
  <p>After deep scientific research and 0% bias...  
  I have concluded something important.</p>

  <h2>Will you be my Valentine? 💘</h2>

  <button id="yesBtn">YES 💖</button>
  <button id="noBtn">No 😈</button>

  <div id="message"></div>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const message = document.getElementById("message");

const noTexts = [
  "Are you sure? 🥺",
  "Double sure?? 😳",
  "This feels illegal... 😭",
  "The 'No' button might be broken 👀",
  "Okay now you're just testing me 😤"
];

let noCount = 0;

noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * 200 - 100;
  const y = Math.random() * 200 - 100;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
});

noBtn.addEventListener("click", () => {
  message.textContent = noTexts[Math.min(noCount, noTexts.length - 1)];
  noCount++;
});

yesBtn.addEventListener("click", () => {
  message.innerHTML = "YAYYYYY 🥰💖 BEST DECISION EVER 🎉<br>I love youuuuu!";
  document.body.style.background = "linear-gradient(135deg,#ff006e,#ffbe0b)";
});
</script>

</body>
</html>
