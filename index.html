<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💘</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  background: url("pattern.png");
  background-size: 500px;
  background-repeat: repeat;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  color: white;
}

/* DARK OVERLAY so silhouette is visible */
.overlay {
  width: 100%;
  min-height: 100vh;
  background: rgba(0,0,0,0.6);
  padding: 30px 20px;
}

/* BIG SILHOUETTE */
.hero {
  max-width: 300px;
  width: 80%;
  margin-bottom: 20px;
  filter: drop-shadow(0 10px 30px rgba(0,0,0,0.6));
}

.card {
  max-width: 500px;
  margin: auto;
}

button {
  padding: 12px 18px;
  font-size: 16px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  margin: 8px;
}

#yesBtn {
  background: #ff4d6d;
  color: white;
}

#noBtn {
  background: white;
  color: black;
}

#msg {
  margin-top: 20px;
  font-weight: bold;
  min-height: 24px;
}
</style>
</head>

<body>

<div class="overlay">

  <!-- THIS IS YOUR SILHOUETTE -->
  <img src="silhouette.PNG" class="hero" alt="Us">

  <div class="card">
    <h1>🚨 IMPORTANT QUESTION 🚨</h1>
    <p>I ran the numbers. The results say you’re my favorite person.</p>
    <h2>Will you be my Valentine? 💘</h2>

    <button id="yesBtn">YES 💖</button>
    <button id="noBtn">No 😈</button>

    <div id="msg"></div>
  </div>

</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const msg = document.getElementById("msg");

const responses = [
  "Are you sure? 🥺",
  "Double sure?? 😳",
  "That answer seems incorrect 🤨",
  "Okay now you're just teasing me 😤"
];

let count = 0;

noBtn.addEventListener("click", () => {
  msg.textContent = responses[Math.min(count, responses.length - 1)];
  count++;
});

yesBtn.addEventListener("click", () => {
  msg.innerHTML = "YAYYYYY 🥰💖🎉<br>Valentine mode activated!";
  noBtn.style.display = "none";
});
</script>

</body>
</html>
