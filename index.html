<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Important Question 💘</title>

<style>
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #ff4d6d, #ff8fab, #ffc2d1);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;   /* FIXED MOBILE SCROLL */
  overflow-x: hidden;
  padding: 20px;
  text-align: center;
  color: white;
}

.container {
  background: rgba(0, 0, 0, 0.65);
  padding: 30px;
  border-radius: 20px;
  width: 100%;
  max-width: 500px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

img {
  width: 100%;
  border-radius: 15px;
  margin-bottom: 20px;
}

h1 {
  margin-bottom: 10px;
}

button {
  padding: 12px 20px;
  font-size: 16px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  margin: 8px;
  transition: 0.2s ease;
}

#yesBtn {
  background: #ff4d6d;
  color: white;
}

#yesBtn:hover {
  transform: scale(1.1);
}

#noBtn {
  background: white;
  color: black;
  position: relative;
}

#message {
  margin-top: 20px;
  font-weight: bold;
  min-height: 24px;
}

.celebrate {
  animation: pulse 0.6s ease infinite alternate;
}

@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.1); }
}
</style>
</head>

<body>

<div class="container">
  <img src="us.jpg" alt="Us being adorable">

  <h1>🚨 VERY IMPORTANT QUESTION 🚨</h1>
  <p>I have conducted extensive research and determined something critical...</p>

  <h2>Will you be my Valentine? 💘</h2>

  <button id="yesBtn">YES 💖</button>
  <button id="noBtn">No 😈</button>

  <div id="message"></div>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const message = document.getElementById("message");

const noResponses = [
  "Are you sure? 🥺",
  "Double sure?? 😳",
  "That seems incorrect 🤨",
  "The 'No' button is suspicious 🤔",
  "At this point you're just teasing me 😤"
];

let noCount = 0;

// Only move button on devices that support hover (desktop)
if (window.matchMedia("(hover: hover)").matches) {
  noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 150 - 75;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
  });
}

noBtn.addEventListener("click", () => {
  message.textContent = noResponses[Math.min(noCount, noResponses.length - 1)];
  noCount++;
});

yesBtn.addEventListener("click", () => {
  document.body.style.background = "linear-gradient(135deg,#ff006e,#ffbe0b)";
  message.innerHTML = "YAYYYYY 🥰💖 BEST DECISION EVER 🎉<br>I love youuuuu!";
  yesBtn.classList.add("celebrate");
  noBtn.style.display = "none";
});
</script>

</body>
</html>
